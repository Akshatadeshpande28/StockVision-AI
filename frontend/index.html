<div class="container mt-4">

    <h1 class="text-center mb-4">
        📈 StockVision AI
    </h1>

    <div class="row mb-4">

        <div class="col-md-9">
            <input
                class="form-control"
                id="symbol"
                placeholder="RELIANCE.NS">
        </div>

        <div class="col-md-3">
            <button
                class="btn btn-primary w-100"
                onclick="analyzeStock()">
                Analyze
            </button>
        </div>

    </div>

    <div id="summary" class="row g-3 mb-4">

</div>

    <div class="row mt-4">

        <div class="col-md-8">
            <div class="card shadow p-3">

                <h4>Candlestick Chart</h4>

                <div id="chart"></div>

            </div>
        </div>

        <div class="col-md-4">

            <div id="technical"></div>

            <br>

            <div id="fundamental"></div>

        </div>

    </div>

</div>
